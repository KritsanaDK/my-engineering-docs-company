apiVersion: v1
kind: ConfigMap
metadata:
  name: iia-proxy-isv-config
  namespace: insurverse
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        access_log off;
        server {
            listen 80;
            location / {
                proxy_pass http://10.92.0.32;
                proxy_connect_timeout 10s;
                proxy_read_timeout 60s;
                proxy_send_timeout 60s;
                proxy_buffering off;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iia-proxy-isv
  namespace: insurverse
  labels:
    app: iia-proxy-isv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iia-proxy-isv
  template:
    metadata:
      labels:
        app: iia-proxy-isv
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: iia-proxy-isv-config
---
apiVersion: v1
kind: Service
metadata:
  name: iia-proxy-isv-service
  namespace: insurverse
spec:
  selector:
    app: iia-proxy-isv
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
