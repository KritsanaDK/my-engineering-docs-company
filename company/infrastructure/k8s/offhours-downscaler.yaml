# ------------------------------------------------------------------
# Kubernetes Off-Hours Downscaler (Cost-Optimization for Option 1)
# Scale down deployments to 0 replicas at 22:00 & Scale up to 1 at 07:00
# ------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-scale-manager
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uat-scale-manager-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uat-scale-manager-binding
subjects:
  - kind: ServiceAccount
    name: uat-scale-manager
    namespace: default
roleRef:
  kind: ClusterRole
  name: uat-scale-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# CronJob 1: Nightly Scale-Down to 0 (Everyday at 22:00 ICT / 15:00 UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uat-nightly-scaledown
  namespace: default
spec:
  schedule: "0 15 * * *" # 22:00 ICT (UTC+7)
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: uat-scale-manager
          restartPolicy: OnFailure
          containers:
            - name: kubectl-scale
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - "kubectl scale deployment --all --replicas=0"
---
# CronJob 2: Morning Scale-Up to 1 (Mon-Fri at 07:00 ICT / 00:00 UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uat-morning-scaleup
  namespace: default
spec:
  schedule: "0 0 * * 1-5" # 07:00 ICT Monday to Friday (UTC+7)
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: uat-scale-manager
          restartPolicy: OnFailure
          containers:
            - name: kubectl-scale
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - "kubectl scale deployment --all --replicas=1"
