# Helm Values Patch: go-echo-analytics-service (Production)
# ปัญหาที่แก้ไข: Issue #25 - CORS OPTIONS 503 ((no backend)) บน Analytics Service (Preflight NEG Drop)
# คำสั่งใช้งาน: helm upgrade backend-analytics-service ./helm --reuse-values -f patch_analytics_prod.yaml -n default
# หมายเหตุ: ห้ามแก้ไข helm-prod.yaml ใน repo โดยตรง

livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 3
  periodSeconds: 8
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 3
  periodSeconds: 8
  failureThreshold: 5

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 15"]
